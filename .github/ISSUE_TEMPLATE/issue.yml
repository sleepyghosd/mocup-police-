name: Issue
description: Report a bug, request a feature, or log a technical task
labels: []
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the issue
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
