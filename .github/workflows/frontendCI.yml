name: Frontend CI

on:
  push:
    branches-ignore:
      - main
      - development
    paths:
      - 'frontend/**'
      - '.github/workflows/frontendCI.yml'
  pull_request:
    branches-ignore:
      - main
      - development
    paths:
      - 'frontend/**'
      - '.github/workflows/frontendCI.yml'

jobs:
  frontend-ci:
    name: Frontend - Lint, Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Lint - Prettier format check
        working-directory: ./frontend
        run: npm run format:check
        continue-on-error: true

      - name: Lint - ESLint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: false
      
      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test -- --ci --coverage
        continue-on-error: false
        env:
          CI: true
        
      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true
